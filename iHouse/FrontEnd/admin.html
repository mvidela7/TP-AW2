
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administrar productos | iHouse</title>
    <link rel="stylesheet" href="recursos/css/index.css">
</head>
<body>

    <header>
        <h1>iHouse - Administración</h1>
        <nav>
            <a href="index.html">Inicio</a>
            <a href="catalogo.html">Catálogo</a>
            <a href="contacto.html">Contacto</a>
        </nav>
    </header>

    <main>
        <h2>Administrar productos</h2>

        <form id="formProducto">
            <input type="hidden" id="idProducto">

            <label for="nombre">Nombre del producto</label>
            <input type="text" id="nombre" required>

            <label for="precio">Precio</label>
            <input type="number" id="precio" min="0" step="0.01" required>

            <label for="imagen">URL de la imagen</label>
            <input type="text" id="imagen">

            <button type="submit" id="btnGuardar">Agregar producto</button>
            <button type="button" id="btnCancelar" hidden>Cancelar edición</button>
        </form>

        <p id="mensaje"></p>

        <h2>Productos registrados</h2>

        <div class="tabla-contenedor">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Producto</th>
                        <th>Precio</th>
                        <th>Imagen</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="listaProductos"></tbody>
            </table>
        </div>
    </main>

    <script src="recursos/js/admin.js"></script>
</body>
</html>
